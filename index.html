<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: sans-serif;
}

.number, .yaku {
  display: inline-block;
  padding: 6px;
  margin: 4px;
  border: 1px solid black;
  cursor: pointer;
  font-size: 13px;
  background: white;
}

.disabled { background: #ccc; }
.roleLocked { background: #aaa; }
.roleExcluded { background: #fff3cd; border: 1px dashed #c98b00; }
.selected { background: #90ee90; }

.dexInput {
  width: 45px;
  margin-left: 5px;
}

.sortButtons {
  margin-bottom: 10px;
}

.sortButtons button {
  margin-right: 5px;
  padding: 5px 10px;
}

.hoverBox {
  margin-top: 10px;
  padding: 10px;
  border: 1px solid black;
}

#hoverInfo {
  width: 100%;
  height: 260px;
  min-height: 80px;
  box-sizing: border-box;
  resize: vertical;
  font-family: sans-serif;
  font-size: 14px;
  line-height: 1.6;
  padding: 8px;
}

.infoControls {
  margin-top: 6px;
}

.infoControls button {
  padding: 5px 10px;
  cursor: pointer;
}

#infoStatus {
  font-size: 12px;
  color: #666;
  margin-left: 8px;
}
</style>
</head>

<body>

<h3>札（24枚）</h3>

<div class="sortButtons">
  <button onclick="sortNumbers('asc')">DEX昇順</button>
  <button onclick="sortNumbers('desc')">DEX降順</button>
  <button onclick="sortNumbers('original')">元の順番</button>
</div>

<div id="numbers"></div>

<h3>役（19種）</h3>
<div id="yakus"></div>

<button onclick="nextTurn()">次のターン（全解除）</button>

<h3>情報</h3>

<div class="hoverBox">
  <textarea id="hoverInfo"
    placeholder="札または役にマウスを乗せると情報が表示されます。ここで自由に編集できます。"
    disabled></textarea>

  <div class="infoControls">
    <button onclick="resetInfo()">初期状態に戻す</button>
    <span id="infoStatus">札・役を選択してください</span>
  </div>
</div>

// --- 状態管理 ---

let manuallyDisabledCards = new Set();
let selectedYakus = new Set();
let roleCardExclusions = new Map();

let currentSort = "original";

let dexValues = loadStorage("hanafudaDexValues", {});

let customInfo = loadStorage("hanafudaCustomInfo", {});

let activeInfoKey = null;
let infoLocked = false; // 右クリックで情報欄を固定

// --- 保存・読み込み ---

function loadStorage(key, fallback) {
  try {
    const value = localStorage.getItem(key);
    return value ? JSON.parse(value) : fallback;
  } catch(e) {
    return fallback;
  }
}

function saveDexValues() {
  localStorage.setItem(
    "hanafudaDexValues",
    JSON.stringify(dexValues)
  );
}

function saveCustomInfo() {
  localStorage.setItem(
    "hanafudaCustomInfo",
    JSON.stringify(customInfo)
  );
}

// --- 情報欄の初期文章 ---

function getOriginalCardInfo(name) {

  const relatedYakus = yakus
    .filter(y => y.cards.includes(name))
    .map(y => y.name);

  let text = `札情報：${name}\n\n含まれる役：`;

  if (relatedYakus.length === 0) {
    text += "\nなし";
  } else {
    text += "\n・" + relatedYakus.join("\n・");
  }

  return text;
}

function getOriginalYakuInfo(y) {

  return `必要札：${y.cards.join("、")}\n宣言：${y.declare}\n発動：${y.activate}\n条件：${y.condition}\nコスト：${y.cost}\n効果：${y.effect}`;
}

// --- 情報欄の表示・編集 ---

function showInfo(key, originalText, label, force = false) {

  // 固定中は、右クリックなど明示的な切り替え以外で情報を変更しない
  if (infoLocked && !force) return;

  activeInfoKey = key;

  hoverInfo.disabled = false;

  hoverInfo.value =
    Object.prototype.hasOwnProperty.call(customInfo, key)
      ? customInfo[key]
      : originalText;

  infoStatus.innerText = (infoLocked ? " 編集固定中：" : "") + label + " の情報を編集中";
}

function toggleInfoLock(key, originalText, label) {

  // 同じ対象を右クリックした場合は固定解除
  if (infoLocked && activeInfoKey === key) {
    infoLocked = false;
    infoStatus.innerText = label + " の情報を編集中（固定解除）";
    return;
  }

  // 別の対象を右クリックした場合は、その対象に切り替えて固定
  infoLocked = true;
  showInfo(key, originalText, label, true);
  infoStatus.innerText = " 編集固定中：" + label + "（右クリックで解除）";
}

hoverInfo.addEventListener("input", () => {

  if (activeInfoKey === null) return;

  customInfo[activeInfoKey] = hoverInfo.value;

  saveCustomInfo();

  infoStatus.innerText = "保存しました";

});

function resetInfo() {

  if (activeInfoKey === null) return;

  delete customInfo[activeInfoKey];

  saveCustomInfo();

  const key = activeInfoKey;

  if (key.startsWith("card-")) {

    const num = Number(key.replace("card-", ""));
    const name = cards[num];

    showInfo(
      key,
      getOriginalCardInfo(name),
      name,
      true
    );

  } else if (key.startsWith("yaku-")) {

    const index = Number(key.replace("yaku-", ""));
    const y = yakus[index];

    showInfo(
      key,
      getOriginalYakuInfo(y),
      y.name,
      true
    );

  }

  infoStatus.innerText = infoLocked
    ? "編集固定中：初期状態に戻しました（右クリックで解除）"
    : "初期状態に戻しました";

}

// --- DEX ---

function getDex(num) {

  const value = dexValues[num];

  if (value === undefined || value === "")
    return null;

  const n = Number(value);

  if (!Number.isFinite(n))
    return null;

  return n;
}

// --- 使用済み札 ---

function getRoleExclusions(roleIndex) {
  return roleCardExclusions.get(roleIndex) || new Set();
}

function getRoleOwner(cardNumber) {
  let excludedOwner = null;

  for (const roleIndex of selectedYakus) {
    const hasCard = yakus[roleIndex].cards.some(
      card => nameToNumber[card] === cardNumber
    );

    if (!hasCard) continue;

    if (!getRoleExclusions(roleIndex).has(cardNumber)) {
      return roleIndex;
    }

    if (excludedOwner === null) {
      excludedOwner = roleIndex;
    }
  }

  return excludedOwner;
}

function getUsedByRole() {
  const used = new Set();

  selectedYakus.forEach(roleIndex => {
    const excluded = getRoleExclusions(roleIndex);

    yakus[roleIndex].cards.forEach(card => {
      const number = nameToNumber[card];

      if (!excluded.has(number)) {
        used.add(number);
      }
    });
  });

  return used;
}

// --- 並び替え ---

function sortNumbers(mode) {

  currentSort = mode;

  renderNumbers();

}

function getSortedCards() {

  const entries = Object.entries(cards);

  if (currentSort === "original")
    return entries;

  entries.sort((a, b) => {

    const dexA = getDex(Number(a[0]));
    const dexB = getDex(Number(b[0]));

    if (dexA === null && dexB === null)
      return Number(a[0]) - Number(b[0]);

    if (dexA === null) return 1;
    if (dexB === null) return -1;

    if (currentSort === "asc")
      return dexA - dexB;

    return dexB - dexA;

  });

  return entries;
}

// --- 札の表示 ---

function renderNumbers() {

  numberDiv.innerHTML = "";

  const usedByRole = getUsedByRole();

  getSortedCards().forEach(([num, name]) => {

    const n = Number(num);

    const div = document.createElement("div");

    div.className = "number";

    const nameSpan = document.createElement("span");

    nameSpan.innerText = `${num}:${name}`;

    div.appendChild(nameSpan);

    const dexLabel = document.createElement("span");

    dexLabel.innerText = " DEX:";

    div.appendChild(dexLabel);

    const dexInput = document.createElement("input");

    dexInput.type = "number";
    dexInput.className = "dexInput";
    dexInput.value = dexValues[n] ?? "";
    dexInput.placeholder = "未入力";

    dexInput.onclick = e => e.stopPropagation();
    dexInput.onmousedown = e => e.stopPropagation();

    dexInput.oninput = e => {

      dexValues[n] = e.target.value;

      saveDexValues();

      if (currentSort !== "original") {
        renderNumbers();
      }

    };

    div.appendChild(dexInput);

    const roleOwner = getRoleOwner(n);
    const roleExcluded = roleOwner !== null &&
      getRoleExclusions(roleOwner).has(n);

    if (manuallyDisabledCards.has(n))
      div.classList.add("disabled");

    if (usedByRole.has(n))
      div.classList.add("roleLocked");

    if (roleExcluded) {
      div.classList.add("roleExcluded");
      div.title = "役から除外中（クリックで元に戻す）";
    } else if (roleOwner !== null) {
      div.title = "役で使用中（クリックでこの札だけ除外）";
    }

    div.onclick = () => {

      const owner = getRoleOwner(n);

      if (owner !== null) {
        const excluded = new Set(getRoleExclusions(owner));

        if (excluded.has(n))
          excluded.delete(n);
        else
          excluded.add(n);

        roleCardExclusions.set(owner, excluded);
      } else {
        if (manuallyDisabledCards.has(n))
          manuallyDisabledCards.delete(n);
        else
          manuallyDisabledCards.add(n);
      }

      renderNumbers();
      renderYakus();

    };

    div.onmouseenter = () => {

      showInfo(
        `card-${n}`,
        getOriginalCardInfo(name),
        name
      );

    };

    // 右クリックで情報欄を固定／解除
    div.oncontextmenu = e => {
      e.preventDefault();
      toggleInfoLock(`card-${n}`, getOriginalCardInfo(name), name);
    };

    numberDiv.appendChild(div);

  });

}

// --- 役の表示 ---

function renderYakus() {

  yakuDiv.innerHTML = "";

  yakus.forEach((y, i) => {

    const div = document.createElement("div");

    div.className = "yaku";
    div.innerText = y.name;

    const nums = y.cards.map(c => nameToNumber[c]);

    const selected = selectedYakus.has(i);
const usedByOtherSelectedRoles = getUsedByRole();
    const roleBlocked = nums.some(n => usedByOtherSelectedRoles.has(n));

    const manuallyBlocked = nums.some(
      n => manuallyDisabledCards.has(n)
    );

    // 必要札が手動除外中、または別の選択中の役で使用中なら選択不可
    const cannotUse = manuallyBlocked || roleBlocked;

    if (cannotUse && !selected)
      div.classList.add("disabled");

    if (selected)
      div.classList.add("selected");

    div.onclick = () => {

      if (cannotUse && !selected) return;

      if (selected) {
        selectedYakus.delete(i);
        roleCardExclusions.delete(i);
      } else {
        selectedYakus.add(i);
        roleCardExclusions.set(i, new Set());
      }

      renderYakus();
      renderNumbers();

    };

    div.onmouseenter = () => {

      showInfo(
        `yaku-${i}`,
        getOriginalYakuInfo(y),
        y.name
      );

    };

    // 右クリックで情報欄を固定／解除
    div.oncontextmenu = e => {
      e.preventDefault();
      toggleInfoLock(`yaku-${i}`, getOriginalYakuInfo(y), y.name);
    };

    yakuDiv.appendChild(div);

  });

}

// --- 次のターン ---

function nextTurn() {

  selectedYakus.clear();
  roleCardExclusions.clear();

  manuallyDisabledCards.clear();

  renderYakus();
  renderNumbers();

}

// --- 初期表示 ---

renderYakus();
renderNumbers();

</script>
